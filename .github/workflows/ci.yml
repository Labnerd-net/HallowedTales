name: CI

# Check-only. Deploys are handled separately (see CLAUDE.md / package.json "deploy" script).
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "context/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate Worker types
        run: npm run types

      - name: Typecheck
        run: npm run typecheck

      - name: Test (includes content style/self-reference rules)
        run: npm test

      - name: Build
        run: npm run build
