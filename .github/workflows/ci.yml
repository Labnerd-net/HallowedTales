name: CI

# Check-only. Deploys are handled separately (see CLAUDE.md / package.json "deploy" script).
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "context/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate Worker types
        run: npm run types

      - name: Typecheck
        run: npm run typecheck

      - name: Test (includes content style/self-reference rules)
        run: npm test

      - name: Build
        run: npm run build
